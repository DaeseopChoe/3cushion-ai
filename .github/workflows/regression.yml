name: 3Cushion AI Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression Suite & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fast Regression
        run: npm run test:fast

      - name: Contract Regression
        run: npm run test:contract

      - name: Full Vitest Suite
        run: npm test

      - name: Production Build & Dataset Packaging
        run: npm run build
