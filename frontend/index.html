<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- PWA manifest (가로모드 고정) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Phase G: 모바일 줌 완전 차단 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <title>3Cushion AI</title>

    <!--
      Phase 3E-2: Instant Table Shell (First Visual before React).
      Inline only — no image/font/API. Removed when .table-svg is ready.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        overflow: hidden;
      }

      #app-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0)
          env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
        background: #0f172a;
        pointer-events: none;
      }

      #app-shell .app-shell__frame {
        width: min(92vw, calc((100vh - 24px) * 2));
        max-width: 100%;
        aspect-ratio: 2 / 1;
        border-radius: 10px;
        background: #8d582f;
        box-sizing: border-box;
        padding: min(2.4vw, 14px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      }

      #app-shell .app-shell__cushion {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: min(1.1vw, 7px);
        background: #1e40af;
      }

      #app-shell .app-shell__cloth {
        width: 100%;
        height: 100%;
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <div id="app-shell" data-app-shell="1" aria-hidden="true">
      <div class="app-shell__frame">
        <div class="app-shell__cushion">
          <div class="app-shell__cloth"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
